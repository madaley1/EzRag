services:
  fe:
    image: oven/bun:1.1
    working_dir: /app
    command: sh -lc "bun install && bun run dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://be:8000
      VITE_WS_URL: ws://be:8000
    volumes:
      - ./FE:/app
      - /app/node_modules
    depends_on:
      - be
    networks:
      - app-net

  be:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -lc "pip install --no-cache-dir -r requirements.txt &&
      uvicorn ${BE_APP_MODULE:-app.main:app} --reload --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      BE_APP_MODULE: app.main:app
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      MODEL_BASE_URL: http://model:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./BE:/app
    depends_on:
      - chromadb
      - redis
      - model
    networks:
      - app-net

  model:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-net

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ALLOW_RESET: "TRUE"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app-net

volumes:
  ollama_data:
  chroma_data:
  redis_data:

networks:
  app-net:
    driver: bridge
