# Production-style template for EZRag.
#
# Differences vs docker-compose.dev.yml:
#   - no host bind-mounts for source code (FE/ and BE/)
#   - no `develop: watch:` blocks (no hot reload)
#   - no obsidian-vault or other personal volume mounts
#   - no auto `ollama pull` entrypoint (pull the model yourself once)
#   - no host port exposure for ChromaDB or Redis (kept internal to the network)
#
# Fill in the RAG_DIRS volume mounts on the `be` service with whatever
# directories you want indexed.

services:
  fe:
    image: imbios/bun-node:latest
    working_dir: /app
    command: sh -lc "bun i && bun run build && bun run preview --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - be
    networks:
      - app-net

  be:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -lc "pip install --no-cache-dir -r requirements.txt &&
      uvicorn ${BE_APP_MODULE:-app.main:app} --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      # Mount the directories you want the RAG to index here.
      # The container path(s) must match RAG_DIRS below.
      - ./data:/data
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      BE_APP_MODULE: app.main:app
      RAG_DIRS: /data
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      MODEL_BASE_URL: http://model:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TIKA_SERVER_ENDPOINT: http://tika:9998
      TIKA_CLIENT_ONLY: "True"
    depends_on:
      - chromadb
      - redis
      - model
      - tika
    networks:
      - app-net

  tika:
    image: apache/tika:latest
    networks:
      - app-net

  model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-net

  chromadb:
    image: chromadb/chroma:0.4.14
    environment:
      IS_PERSISTENT: "TRUE"
      ALLOW_RESET: "TRUE"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app-net

volumes:
  ollama_data:
  chroma_data:
  redis_data:

networks:
  app-net:
    driver: bridge
