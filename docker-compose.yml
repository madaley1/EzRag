services:
  fe:
    build: ./FE
    ports:
      - "80:80"
    depends_on:
      - be
    networks:
      - app-net

  be:
    build: ./BE
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      # To add your directories for scanning, follow template below
      # - /<your-directory-uri>:/data/<directoryName>
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      MODEL_BASE_URL: http://model:11434
      OLLAMA_MODEL: qwen3:1.7b
      TIKA_SERVER_ENDPOINT: http://tika:9998
      TIKA_CLIENT_ONLY: "True"
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_started
      model:
        condition: service_started
      tika:
        condition: service_started
    networks:
      - app-net

  tika:
    image: apache/tika:latest
    networks:
      - app-net

  model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MODEL: qwen3:1.7b
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull $${OLLAMA_MODEL} && wait"]
    networks:
      - app-net

  chromadb:
    image: chromadb/chroma:0.4.14
    environment:
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app-net

volumes:
  ollama_data:
  chroma_data:
  redis_data:

networks:
  app-net:
    driver: bridge
